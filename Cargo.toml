[package]
name = "tessera"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A small, automatic desktop icon layer for wlroots-style Wayland compositors"
license = "MIT"

[dependencies]
anyhow = "1"
cairo-rs = "0.22"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
gtk4-layer-shell = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.2"

[profile.release]
strip = true
